<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT-polygon947</title>
    <link rel="stylesheet" href="style.css"/>
    <link rel="shortcut icon" href="images/logo.png" type="image/x-icon">
</head>
<body>
    <header class="header">
        <div class="header_cont">
            <ul class="header_list">                                                       
                <li>
                    <input class="search" id="search" type="text" autocomplete="off" placeholder="Поиск">
                </li>
                <li class="bot">
                    <a class="header_link" href="/">Наш бот</a>
                </li>
                <li class="set">
                    <button class="setbut"></button>
                </li>
            </ul>
        </div>
    </header>
    <main class="main">
        <div class="list" id="list"></div>
    </main>
    <script type="module">
        const list = document.getElementById("list");
        const count = 6;
            
        async function loadText(block, i) {
            let res = await fetch(`blocks/block${i}/text.txt`);
            let text = await res.text();
            block.querySelector(".conttext").textContent = text;
        }
        
        for (let i = 1; i <= count; i++) {
            const block = document.createElement("a");
            block.className = "frmae";
            block.href = `blocks/block${i}/content.pdf`;
            block.innerHTML = `
                <div class="cont">
                    <img src="blocks/block${i}/image.png" class="contimage">
                </div>
                <p class="conttext">Загрузка...</p>
            `;
            list.appendChild(block);
            
            loadText(block, i); // Просто вызываем функцию для каждой карточки
        }
    </script>
    <script>
        const searchbar=document.getElementById("search")
        const list=document.getElementById("list")
        var blocks=list.children
        function search(event) {
            if (event.key=="Enter"){
                var inp=searchbar.value.toLowerCase()
                console.log(inp)
                for (i of blocks){
                    if (i.textContent.toLowerCase().includes(inp)){
                        i.style.display="block";
                        window.scrollTo(0, 0);
                    } else {
                        i.style.display="none";
                    }
                }
            }
        } searchbar.onkeydown=search;
    </script>
</body>
</html>
