<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT-polygon947</title>
    <link rel="stylesheet" href="style.css"/>
    <link rel="shortcut icon" href="images/logo.png" type="image/x-icon">
</head>
<body>
    <header class="header">
        <div class="header_cont">
            <ul class="header_list">                                                       
                <li>
                    <input class="search" id="search" type="text" autocomplete="off" placeholder="Поиск">
                </li>
                <li class="bot">
                    <a class="header_link" href="/">Наш бот</a>
                </li>
                <li class="set">
                    <button class="setbut"></button>
                </li>
            </ul>
        </div>
    </header>
    <main class="main">
        <div class="list" id="list"></div>
    </main>
    <script type="module"> // ЗАГРУЗКА БЛОКОВ
        let n=1
        const list = document.getElementById("list")
        var txtFile=await fetch("blocks/a.txt")
        var txttext=await txtFile.text()
        var lines=txttext.split("\n")
        for (let i=0; i<lines.length; i++) {
            var pngP="blocks/block"+i+"/image.png"
            var pdfP="blocks/block"+i+"/content.pdf"
            var line0=lines[i]
            var frame=document.createElement("a");
            frame.className="frmae";
            frame.href=pdfP;
            frame.innerHTML=
                `<div class="cont">
                    <img src="${pngP}" class="contimage">
                </div>
                <p class="conttext">${line0}</p>`
            list.append(frame)
        }
    </script>

    <script> // ПОИСК
        const searchbar=document.getElementById("search")
        const list=document.getElementById("list")
        var blocks=list.children
        function search(event) {
            if (event.key=="Enter"){
                var inp=searchbar.value.toLowerCase()
                console.log(inp)
                for (i of blocks){
                    if (i.textContent.toLowerCase().includes(inp)){
                        i.style.display="block";
                        window.scrollTo(0, 0);
                    } else {
                        i.style.display="none";
                    }
                }
            }
        } searchbar.onkeydown=search;
    </script>
</body>
</html>
